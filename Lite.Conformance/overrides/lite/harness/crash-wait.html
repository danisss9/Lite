<!doctype html>
<html class="test-wait">
<body>
<script>
var frameCount = 0;
var lastFrame = 0;
requestAnimationFrame(function (time) {
  frameCount++;
  lastFrame = time;
  requestAnimationFrame(function (time) { frameCount++; lastFrame = time; });
});
document.documentElement.addEventListener('TestRendered', function () {
  if (frameCount !== 2) return;
  requestAnimationFrame(function (time) {
    if (time > lastFrame) document.documentElement.removeAttribute('class');
  });
});
</script>
</body>
</html>
