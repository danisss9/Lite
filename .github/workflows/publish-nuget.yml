name: Publish to NuGet

on:
  push:
    tags:
      - 'lite_*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#lite_}" >> $GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate tag matches project version
        shell: pwsh
        run: |
          $projectVersion = dotnet msbuild Lite/Lite.csproj -getProperty:Version
          if ($projectVersion.Trim() -ne '${{ steps.version.outputs.VERSION }}') {
            throw "Tag version ${{ steps.version.outputs.VERSION }} does not match Lite.csproj version $projectVersion."
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned tests
        shell: pwsh
        run: ./scripts/fetch-tests.ps1

      - name: Generate pinned WPT manifest
        shell: pwsh
        run: ./scripts/build-wpt-manifest.ps1

      - name: Restore
        run: dotnet restore Lite.sln

      - name: Build
        run: dotnet build Lite.sln --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          $audit = (& dotnet list Lite.sln package --vulnerable --include-transitive 2>&1 | Out-String)
          Write-Host $audit
          if ($LASTEXITCODE -ne 0 -or $audit -match 'has the following vulnerable packages') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Export HTML inventory backlog
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite html5-inventory

      - name: Unit tests
        run: dotnet run --project Lite.Tests/Lite.Tests.csproj --configuration Release --no-build --no-restore -- --report Lite.Conformance/artifacts/unit-results.json

      - name: CSS 2.1 gate
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite css21 --report Lite.Conformance/artifacts/css21-results.json

      - name: WPT gate
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite wpt --report Lite.Conformance/artifacts/wpt-results.json

      - name: Full ES2020 language and host release gate (eight Windows shards)
        run: python scripts/run-es2020.py --evidence Lite.Conformance/artifacts/unit-results.json

      # Acid2 is tracked as a known failing profile entry. Keep the release gate aligned with
      # regular CI by enforcing the approved Acid1 regression without presenting Acid2 as green.
      - name: Acid1 regression
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite acid --filter acid1

      - name: HTML 5.0 reviewed assertion tests
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite html5 --report Lite.Conformance/artifacts/html5-results.json

      # Publishes the contract and every readiness verdict (release, ES2020, HTML 5.0, CSS 2.1)
      # as release evidence without enforcing them, exactly like regular CI. The ES2020 normative
      # review is still open, and on the Jint 4.16.3 pin the two published expected failures
      # (document.all, annexB block-decl-func-arguments) keep es2020ProfileReady false by contract,
      # so enforcing --require-es2020-ready here would block every tag until the compatibility
      # program completes. Re-add the flag once the review is closed and those gaps are published
      # dependency exceptions.
      - name: Generate HTML 5.0 compatibility evidence
        if: always()
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite profile --report compatibility-report.json --evidence Lite.Conformance/artifacts/unit-results.json --evidence Lite.Conformance/artifacts/wpt-results.json --evidence Lite.Conformance/artifacts/html5-results.json --evidence Lite.Conformance/artifacts/css21-results.json --evidence Lite.Conformance/artifacts/es2020/host.json --evidence Lite.Conformance/artifacts/es2020/test262-0.json --evidence Lite.Conformance/artifacts/es2020/test262-1.json --evidence Lite.Conformance/artifacts/es2020/test262-2.json --evidence Lite.Conformance/artifacts/es2020/test262-3.json --evidence Lite.Conformance/artifacts/es2020/test262-4.json --evidence Lite.Conformance/artifacts/es2020/test262-5.json --evidence Lite.Conformance/artifacts/es2020/test262-6.json --evidence Lite.Conformance/artifacts/es2020/test262-7.json

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-evidence
          path: |
            compatibility-report.json
            Lite.Conformance/artifacts
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack Lite/Lite.csproj --configuration Release --no-build /p:Version=${{ steps.version.outputs.VERSION }} --output nupkg

      - name: Push to NuGet
        run: dotnet nuget push nupkg/danisss9.Lite.${{ steps.version.outputs.VERSION }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            nupkg/*.nupkg
            compatibility-report.json
