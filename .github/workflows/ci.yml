name: Compatibility gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gates:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache pinned conformance inputs
        uses: actions/cache@v4
        with:
          path: Lite.Conformance/vendor
          key: conformance-${{ runner.os }}-${{ hashFiles('Lite.Conformance/test-suites.lock.json', 'scripts/fetch-tests.ps1') }}

      - name: Fetch pinned tests
        shell: pwsh
        run: ./scripts/fetch-tests.ps1

      - name: Restore
        run: dotnet restore Lite.sln

      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          $audit = (& dotnet list Lite.sln package --vulnerable --include-transitive 2>&1 | Out-String)
          Write-Host $audit
          if ($LASTEXITCODE -ne 0 -or $audit -match 'has the following vulnerable packages') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Build
        run: dotnet build Lite.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet run --project Lite.Tests/Lite.Tests.csproj --configuration Release --no-build --no-restore -- --report Lite.Conformance/artifacts/unit-results.json


      - name: CSS 2.1 curated gate
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite css21

      - name: WPT curated gate
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite wpt --report Lite.Conformance/artifacts/wpt-results.json

      - name: ES2020 sparse Test262 gate
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite test262

      - name: Acid1 regression
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite acid --filter acid1

      - name: HTML 5.3 reviewed assertion tests
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite html53 --report Lite.Conformance/artifacts/html53-results.json

      - name: Generate HTML 5.3 compatibility evidence
        if: always()
        run: dotnet run --project Lite.Conformance/Lite.Conformance.csproj --configuration Release --no-build -- --suite profile --report compatibility-report.json --evidence Lite.Conformance/artifacts/unit-results.json --evidence Lite.Conformance/artifacts/wpt-results.json --evidence Lite.Conformance/artifacts/html53-results.json

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: |
            compatibility-report.json
            Lite.Conformance/artifacts
          if-no-files-found: warn
